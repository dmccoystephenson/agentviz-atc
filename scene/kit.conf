# build-kit.sh settings for the ATC scene (see scene/build.sh).
here="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
KIT_SOURCE="$here/main.cpp"
KIT_OUT="${KIT_OUT:-$here/../web}"
KIT_NAME=atc-engine
KIT_EXPORT_NAME=createAtcEngine
KIT_EXPORTS=_atc_set_airports,_atc_update_airports,_atc_set_planes,_atc_set_lines,_atc_set_waiting,_atc_set_time
